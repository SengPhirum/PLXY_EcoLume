name: Firmware CI

on:
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-ci.yml"
  pull_request:
    paths:
      - "firmware/**"

permissions:
  contents: read

jobs:
  platformio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: cp firmware/include/config.example.h firmware/include/config.h
      - run: pio run -d firmware

