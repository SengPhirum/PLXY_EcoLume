name: Firmware release

# Publishes a versioned ESP32 firmware release. Tag the commit to release it:
#
#   git tag firmware-v1.0.0 && git push origin firmware-v1.0.0
#
# Publishing the release makes the documentation workflow redeploy GitHub Pages,
# so the browser installer always serves the newest stable build.
on:
  push:
    tags:
      - "firmware-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the firmware-v prefix (e.g. 1.0.0)"
        required: true
      prerelease:
        description: "Publish as a pre-release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: firmware-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO and esptool
        run: pip install --upgrade platformio "esptool>=4.7,<5"

      - name: Resolve version
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#firmware-v}"
            prerelease="false"
            case "$version" in *-*) prerelease="true";; esac
          else
            version="${{ inputs.version }}"
            prerelease="${{ inputs.prerelease }}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=firmware-v${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "Building EcoLume firmware ${version} (prerelease=${prerelease})"

      - name: Prepare build configuration
        run: |
          cp firmware/include/config.example.h firmware/include/config.h
          printf '#define ECOLUME_FIRMWARE_VERSION "%s"\n' "${{ steps.meta.outputs.version }}" \
            > firmware/include/version.h

      - name: Build production firmware
        run: pio run -d firmware -e esp32-sim7600-release

      - name: Package installer artifacts
        env:
          FIRMWARE_CHANNEL: ${{ steps.meta.outputs.prerelease == 'true' && 'preview' || 'stable' }}
          FIRMWARE_RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.meta.outputs.tag }}
        run: firmware/scripts/package-firmware.sh "${{ steps.meta.outputs.version }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ecolume-firmware-${{ steps.meta.outputs.version }}
          path: firmware/dist/
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: EcoLume firmware ${{ steps.meta.outputs.version }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: firmware/dist/*
          body: |
            ESP32 field-controller firmware for the PLXY EcoLume platform.

            **Install from a browser** — open the
            [EcoLume installer](https://sengphirum.github.io/PLXY_EcoLume/install/)
            in Chrome, Edge, or Opera on desktop, connect the board over USB, and
            click *Install*. The page serves this exact image.

            **Install locally**

            ```bash
            esptool.py --chip esp32 --baud 921600 write_flash 0x0 ecolume-esp32-${{ steps.meta.outputs.version }}.bin
            ```

            A freshly flashed controller is unprovisioned: it holds the lamp on the
            local safety schedule and waits on the serial console at 115200 baud.
            Type `help` for the provisioning commands.

            Verify downloads against `SHA256SUMS`.

  # The release event cannot start this itself (see docs.yml), so call it.
  publish-docs:
    name: Refresh the installer
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      publish: true
